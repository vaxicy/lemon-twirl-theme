<!doctype html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1280px; height:800px; background:#D6D4CD;
        font-family:"Segoe UI", Arial, sans-serif; color:#392F1E;
        display:flex; flex-direction:column; align-items:center; padding-top:60px; }
.kicker { font-size:14px; letter-spacing:3px; color:#4F571E;
           white-space:pre; }
.title { font-family:Georgia, "Times New Roman", serif; font-size:58px;
          margin-top:14px; color:#241E10; }
.tagline { font-size:19px; margin-top:14px; color:#595042; }
.grid { display:grid; grid-template-columns:520px 520px; gap:30px; margin-top:42px; }
.card { height:186px; border-radius:16px; padding:26px 30px;
         box-shadow:0 4px 14px rgba(43,35,17,.22); border:1px solid rgba(43,35,17,.10);
         display:flex; flex-direction:column; justify-content:center; gap:10px; }
.cname { font-size:25px; font-weight:600; }
.chex { font-size:14px; opacity:.78; }
.chips { display:flex; gap:14px; margin-top:34px; }
.chip { background:#FEFBB4; color:#392F1E; font-size:13.5px;
         padding:9px 18px; border-radius:16px; }
</style></head><body>
<div class="kicker">S Q U E E Z E  O F  S U N S H I N E</div>
<div class="title">Lemon Twirl</div>
<div class="tagline">Pale lemon light with a twist of green.</div>
<div class="grid"><div class="card" style="background:#FEFBB4"><div class="cname" style="color:#1B220C">Lemon Zest</div><div class="chex" style="color:#1B220C">#FEFBB4 &middot; Browser frame</div></div><div class="card" style="background:#F6F6F1"><div class="cname" style="color:#1B220C">Cream Glass</div><div class="chex" style="color:#1B220C">#F6F6F1 &middot; Toolbar & active tab</div></div><div class="card" style="background:#FFEE80"><div class="cname" style="color:#1B220C">Lemon Zing</div><div class="chex" style="color:#1B220C">#FFEE80 &middot; Inactive tabs</div></div><div class="card" style="background:#70941D"><div class="cname" style="color:#1B220C">Leaf Green</div><div class="chex" style="color:#1B220C">#70941D &middot; Links & accents</div></div></div>
<div class="chips"><span class="chip">Solid colors</span><span class="chip">Playful & bright</span><span class="chip">Lemon fresh</span></div>
</body></html>
